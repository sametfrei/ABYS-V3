services:
  abys:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    ports:
      - "3000:3000"
    environment:
      AI_POLICY: ${AI_POLICY:-LOCAL_ONLY}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ABYS_DB_DIR: /app/.data/abys-db
      ABYS_BOOTSTRAP_TOKEN: ${ABYS_BOOTSTRAP_TOKEN:-}
    volumes:
      - abys-data:/app/.data
    depends_on:
      - ollama
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(async r=>{const h=await r.json();process.exit(r.ok&&h.ok===true&&h.schemaReady===true?0:1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  abys-data:
  ollama-data:
