name: ABYS CI and Container Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: abys-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Full test suite with approval gates enforced
        run: npx vitest run --exclude tests/evren-real.tmp.test.ts

      - name: Approved Migration 18 hierarchy tests in isolated test DB
        env:
          ABYS_MIGRATION_18_APPROVED: "true"
        run: npx vitest run tests/organizations.test.ts

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Standalone production build
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_STANDALONE: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" npm run build

  publish-image:
    name: Publish versioned image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/sametfrei/abys-v3
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Build timestamp
        id: buildtime
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and publish immutable commit image plus latest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.buildtime.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true


      - name: Smoke-test the published Docker image
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/sametfrei/abys-v3:${EXPECTED_SHA}"
          CONTAINER="abys-image-smoke-${GITHUB_RUN_ID}"
          TOKEN="$(openssl rand -hex 32)"
          HEALTH_FILE="$RUNNER_TEMP/abys-image-health.json"
          cleanup() {
            docker logs "$CONTAINER" || true
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker pull "$IMAGE"
          docker run -d --name "$CONTAINER" \
            -p 127.0.0.1:3187:3000 \
            -e ABYS_DB_DIR=/app/.data/abys-db \
            -e ABYS_BOOTSTRAP_TOKEN="$TOKEN" \
            -e ABYS_MIGRATION_18_APPROVED=true \
            "$IMAGE"

          READY=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:3187/api/health > "$HEALTH_FILE"; then
              READY=true
              break
            fi
            sleep 2
          done
          test "$READY" = true

          node - "$HEALTH_FILE" "$EXPECTED_SHA" <<'NODE'
          const fs = require("node:fs");
          const [healthPath, expectedSha] = process.argv.slice(2);
          const health = JSON.parse(fs.readFileSync(healthPath, "utf8"));
          if (health.ok !== true || health.db !== "up" || health.schemaReady !== true) {
            throw new Error("container health or schema readiness failed");
          }
          if (health.build?.commit !== expectedSha) {
            throw new Error(`container SHA mismatch: ${health.build?.commit} != ${expectedSha}`);
          }
          if ((health.pendingMigrations ?? []).length !== 0) {
            throw new Error("container has pending migrations");
          }
          console.log(JSON.stringify({
            ok: health.ok,
            db: health.db,
            schemaReady: health.schemaReady,
            commit: health.build.commit
          }));
          NODE

          curl --fail --silent --show-error http://127.0.0.1:3187/login >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3187/setup >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3187/api/auth/bootstrap |
            node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.available!==true)process.exit(1);console.log("first-admin bootstrap is available on empty disposable DB")})'

          echo "Published image smoke test passed: $IMAGE"
